<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Recuperar contraseña</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
            <div class="card shadow-lg border-0 rounded-4" style="width: 420px;">
                <div class="card-body p-4">

                    <h4 class="text-center fw-bold mb-2">Recuperar contraseña</h4>
                    <p class="text-center text-muted mb-4">
                        Ingresa tu correo y te enviaremos un enlace
                    </p>

                    <form onsubmit="event.preventDefault(); forgotPassword();">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" id="email" class="form-control rounded-3" required>
                        </div>

                        <button class="btn btn-primary w-100 rounded-3 mt-3" type="submit">
                            Enviar enlace
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none">
                            Volver al inicio de sesión
                        </a>
                    </div>

                </div>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
                                function forgotPassword() {

                                    const email = $("#email").val();

                                    if (!email) {
                                        Swal.fire({
                                            icon: "warning",
                                            title: "Campo requerido",
                                            text: "Ingresa tu correo electrónico"
                                        });
                                        return;
                                    }

                                    Swal.fire({
                                        title: "Procesando",
                                        text: "Enviando enlace de recuperación...",
                                        allowOutsideClick: false,
                                        didOpen: () => Swal.showLoading()
                                    });

                                    $.ajax({
                                        url: "http://localhost:8080/auth/forgot-password",
                                        method: "POST",
                                        contentType: "application/json",
                                        data: JSON.stringify({email: email}),
                                        success: function (response) {

                                            Swal.fire({
                                                icon: "success",
                                                title: "Solicitud enviada",
                                                text: response.message ||
                                                        "Se enviará un enlace de recuperación."
                                            });

                                            $("#email").val("");
                                        },
                                        error: function () {
                                            Swal.fire({
                                                icon: "error",
                                                title: "Error",
                                                text: "No se pudo procesar la solicitud"
                                            });
                                        }
                                    });
                                }
        </script>

    </body>
</html>
