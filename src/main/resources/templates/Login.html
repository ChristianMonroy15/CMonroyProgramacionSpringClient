<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <div th:if="${param.verified}">
            <div class="alert alert-success">
                Correo verificado correctamente. Ya puedes iniciar sesión.
            </div>
        </div>


        <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

            <div class="card shadow-lg border-0 rounded-4" style="width: 420px;">

                <div class="text-center">
                    <img src="https://www.pngall.com/wp-content/uploads/15/Login-No-Background.png"
                         class="rounded-top-4 img-fluid"
                         style="max-height: 180px; object-fit: contain;"
                         alt="Login Image">
                </div>

                <div class="card-body p-4">

                    <h3 class="text-center fw-bold mb-2">Bienvenido</h3>
                    <p class="text-center text-muted mb-4">
                        Inicia sesión para acceder al sistema
                    </p>

                    <form onsubmit="event.preventDefault(); login();">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="text" id="username" class="form-control rounded-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" id="password" class="form-control rounded-3" required>
                        </div>

                        <button class="btn btn-primary w-100 rounded-3 mt-3" type="submit">
                            Acceder
                        </button>
                    </form>

                    <!-- Recuperar contraseña -->
                    <div id="forgotPasswordBox" class="text-center mt-3 d-none">
                        <a th:href="@{/usuario/forgot-password}" class="text-decoration-none fw-semibold">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>


                </div>
                <div id="verifyBox" class="alert alert-warning mt-3 d-none">
                    <p class="mb-2 fw-semibold">
                        Tu cuenta aún no ha sido verificada.
                    </p>
                    <button type="button"
                            class="btn btn-outline-primary btn-sm w-100"
                            onclick="reenviarCorreo(event)">
                        Reenviar correo de verificación
                    </button>

                </div>


            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
                                document.addEventListener("DOMContentLoaded", function () {
                                    const params = new URLSearchParams(window.location.search);
                                    if (params.get("expired") === "true") {
                                        Swal.fire({
                                            icon: "warning",
                                            title: "Sesión expirada",
                                            text: "Has alcanzado el límite de acciones, inicia sesión de nuevo."
                                        });
                                        sessionStorage.clear();
                                    }
                                });

        </script>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
                                $(document).ready(function () {
                                    $("#username, #password").on("input", function () {
                                        $("#verifyBox").addClass("d-none");
                                        $("#forgotPasswordBox").addClass("d-none");
                                    });
                                });
        </script>
       
        <script>
            function login() {
                const username = $("#username").val();
                const password = $("#password").val();

                $.ajax({
                    url: "http://localhost:8080/auth/login",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        username: username,
                        password: password
                    }),
                    success: function (response) {
                        const token = response.token;

                        console.log("Token recibido:", token);

                        sessionStorage.setItem("token", token);

                        $.ajax({
                            url: "/guardarToken",
                            method: "POST",
                            data: {token: token},
                            success: function () {

                                console.log("Token guardado en HttpSession del backend ✔");

                                const payload = JSON.parse(atob(token.split(".")[1]));
                                const roles = payload.roles || [];
                                const idUsuario = payload.idUsuario;

                                console.log("Roles en token:", roles);
                                console.log("ID usuario:", idUsuario);

                                const normalizedRoles = roles.map(r =>
                                    r.toUpperCase().startsWith("ROLE_")
                                            ? r.toUpperCase()
                                            : "ROLE_" + r.toUpperCase()
                                );

                                console.log("Roles normalizados:", normalizedRoles);

                                setTimeout(() => {
                                    if (normalizedRoles.includes("ROLE_ADMIN")) {
                                        console.log("Redirigiendo a /usuario");
                                        window.location.href = "/usuario";
                                    } else {
                                        console.log("Redirigiendo a /usuario/" + idUsuario);
                                        window.location.href = "/usuario/" + idUsuario;
                                    }
                                }, 150);
                            },
                            error: function () {
                                alert("❌ No se pudo guardar el token en HttpSession");
                            }
                        });
                    },
                    error: function (xhr) {

                        console.log("STATUS:", xhr.status);
                        console.log("RESPONSE:", xhr.responseJSON);

                        const response = xhr.responseJSON;

                        if (xhr.status === 403 && response) {

                            if (response.code === "USER_DISABLED") {
                                Swal.fire({
                                    icon: "error",
                                    title: "Cuenta desactivada",
                                    text: response.message,
                                    confirmButtonColor: "#0d6efd"
                                });
                                return;
                            }

                            if (response.code === "UNVERIFIED_ACCOUNT") {
                                Swal.fire({
                                    icon: "warning",
                                    title: "Cuenta no verificada",
                                    text: response.message,
                                    confirmButtonColor: "#0d6efd"
                                });

                                $("#verifyBox").removeClass("d-none");
                                return;
                            }
                        }

                        if (xhr.status === 401 && response) {
                            Swal.fire({
                                icon: "error",
                                title: "Credenciales incorrectas",
                                text: response.message,
                                confirmButtonColor: "#0d6efd"
                            });
                            $("#forgotPasswordBox").removeClass("d-none");
                            return;
                        }

                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: "No se pudo iniciar sesión",
                            confirmButtonColor: "#0d6efd"
                        });
                    }


                });
            }
        </script>
        <script>
            function reenviarCorreo(event) {

                if (event)
                    event.preventDefault();

                const username = $("#username").val();

                if (!username) {
                    alert("Ingresa tu usuario para reenviar el correo.");
                    return;
                }
                Swal.fire({
                    title: "Enviando correo...",
                    text: "Por favor espera",
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                $.ajax({
                    url: "http://localhost:8080/api/resend-verification",
                    method: "POST",
                    data: {username: username},
                    success: function () {
                        Swal.fire({
                            icon: "success",
                            title: "Correo enviado",
                            text: "Revisa tu bandeja de entrada o spam",
                            confirmButtonColor: "#0d6efd"
                        });
                    },
                    error: function (xhr) {
                        console.log("Error status:", xhr.status);
                        Swal.fire({
                            icon: "error",
                            title: "Error",
                            text: "No se pudo reenviar el correo de verificación",
                            confirmButtonColor: "#dc3545"
                        });
                    }
                });
            }

        </script>
    </body>
</html>
