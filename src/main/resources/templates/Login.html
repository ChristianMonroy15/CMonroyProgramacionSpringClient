<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

            <div class="card shadow-lg border-0 rounded-4" style="width: 420px;">

                <div class="text-center">
                    <img src="https://www.pngall.com/wp-content/uploads/15/Login-No-Background.png"
                         class="rounded-top-4 img-fluid"
                         style="max-height: 180px; object-fit: contain;"
                         alt="Login Image">
                </div>

                <div class="card-body p-4">

                    <h3 class="text-center fw-bold mb-2">Bienvenido</h3>
                    <p class="text-center text-muted mb-4">
                        Inicia sesión para acceder al sistema
                    </p>

                    <form onsubmit="event.preventDefault(); login();">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="text" id="username" class="form-control rounded-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" id="password" class="form-control rounded-3" required>
                        </div>

                        <button class="btn btn-primary w-100 rounded-3 mt-3" type="submit">
                            Acceder
                        </button>
                    </form>

                </div>

            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script>
                        function login() {
                            const username = $("#username").val();
                            const password = $("#password").val();

                            $.ajax({
                                url: "http://localhost:8080/auth/login",
                                method: "POST",
                                contentType: "application/json",
                                data: JSON.stringify({
                                    username: username,
                                    password: password
                                }),
                                success: function (response) {
                                    console.log("Token recibido:", response.token);

                                    const token = response.token;

                                    $.ajax({
                                        url: "/guardarToken",
                                        method: "POST",
                                        data: {token: token},
                                        success: function () {

                                            const payloadBase64 = token.split(".")[1];
                                            const payloadJson = atob(payloadBase64);
                                            const payload = JSON.parse(payloadJson);

                                            const roles = payload.roles || [];
                                            console.log("Roles en token:", roles);

                                            const normalizedRoles = roles.map(r =>
                                                r.startsWith("ROLE_") ? r : "ROLE_" + r
                                            );

                                            const idUsuario = payload.idUsuario;
                                            console.log("ID usuario:", idUsuario);

                                            if (normalizedRoles.includes("ROLE_Admin")) {
                                                window.location.href = "/usuario";
                                            } else {
                                                window.location.href = "/usuario/"+idUsuario;
                                            }
                                        },
                                        error: function () {
                                            alert("No se pudo guardar el token en sesión");
                                        }
                                    });

                                },
                                error: function () {
                                    alert("Usuario o contraseña incorrectos");
                                }
                            });
                        }
        </script>



    </body>
</html>
