<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Restablecer contraseña</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
            <div class="card shadow-lg border-0 rounded-4" style="width: 420px;">
                <div class="card-body p-4">

                    <h4 class="text-center fw-bold mb-2">Restablecer contraseña</h4>
                    <p class="text-center text-muted mb-4">
                        Ingresa tu nueva contraseña
                    </p>

                    <form onsubmit="event.preventDefault(); resetPassword();">
                        <!-- token oculto -->
                        <input type="hidden" id="token">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nueva contraseña</label>
                            <input type="password" id="password" class="form-control rounded-3" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirmar contraseña</label>
                            <input type="password" id="confirmPassword" class="form-control rounded-3" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-3 mt-3">
                            Cambiar contraseña
                        </button>
                    </form>

                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
                                function resetPassword() {

                                    const token = document.getElementById("token").value;
                                    const password = document.getElementById("password").value;
                                    const confirm = document.getElementById("confirmPassword").value;

                                    if (password !== confirm) {
                                        Swal.fire({
                                            icon: "error",
                                            title: "Error",
                                            text: "Las contraseñas no coinciden"
                                        });
                                        return;
                                    }

                                    $.ajax({
                                        url: "http://localhost:8080/auth/reset-password",
                                        method: "POST",
                                        contentType: "application/json",
                                        data: JSON.stringify({
                                            token: token,
                                            password: password
                                        }),
                                        success: function () {
                                            Swal.fire({
                                                icon: "success",
                                                title: "Contraseña actualizada",
                                                text: "Ahora puedes iniciar sesión"
                                            }).then(() => {
                                                window.location.href = "/login";
                                            });
                                        },
                                        error: function (xhr) {
                                            Swal.fire({
                                                icon: "error",
                                                title: "Error",
                                                text: "El enlace ya no es válido o expiró"
                                            });
                                        }
                                    });
                                }
        </script>


        <script>
            // Leer el token desde la URL
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");

            if (!token) {
                alert("Token inválido o ausente");
            } else {
                document.getElementById("token").value = token;
                console.log("Token recibido:", token);
            }
        </script>

    </body>
</html>
